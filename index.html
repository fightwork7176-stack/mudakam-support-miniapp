<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4f0">
  <title>Дорога домой — мини-игра</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #282637;
      --muted: #777383;
      --paper: #f7f4f0;
      --card: #fffefa;
      --accent: #765c91;
      --accent-dark: #5a426f;
      --soft: #eee7f2;
      --line: #e9e4df;
      --shadow: 0 16px 44px rgb(43 35 57 / 9%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 90% 0%, rgb(232 220 240 / 72%), transparent 36rem),
        var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 32px, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .topline { display: flex; justify-content: space-between; align-items: center; }
    .brand { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .step { color: var(--muted); font-size: 13px; }
    .progress { height: 5px; overflow: hidden; margin: 16px 0 32px; border-radius: 8px; background: #e7e2e0; }
    .progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 24px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(29px, 8vw, 40px); line-height: 1.1; letter-spacing: -.035em; }
    .description { margin: 15px 0 25px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .options { display: grid; gap: 10px; }
    button {
      width: 100%;
      min-height: 58px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 13px rgb(43 35 57 / 3%);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    button:active { transform: scale(.985); }
    button:focus-visible, input:focus-visible { outline: 3px solid #b69bc9; outline-offset: 2px; }
    .choice:hover { border-color: #cdbadb; background: #fff; }
    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      font-weight: 700;
      text-align: center;
    }
    .primary:hover:not(:disabled) { background: var(--accent-dark); }
    .primary:disabled { border-color: #c9c4ca; background: #c9c4ca; cursor: not-allowed; }
    .secondary { min-height: 48px; padding: 12px 16px; background: transparent; color: var(--muted); box-shadow: none; text-align: center; }
    .notice { margin-top: 18px; padding: 13px 15px; border-radius: 14px; background: var(--soft); color: #564d60; font-size: 13px; line-height: 1.5; }
    .consent {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin: 8px 0 15px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .consent input { width: 20px; height: 20px; flex: none; margin: 1px 0 0; accent-color: var(--accent); }
    .actions { display: grid; gap: 9px; }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <span class="brand">Дорога домой</span>
      <span class="step" id="step">Начало</span>
    </div>
    <div class="progress" aria-label="Прогресс игры"><span id="progress"></span></div>
    <section class="content" id="content" aria-live="polite"></section>
    <footer class="notice">
      Это бережная игра для размышления, не диагностика и не терапия.
      Не вводи имена, адреса и личные данные детей. При непосредственной опасности
      обратись в местную экстренную службу (в России — 112).
    </footer>
  </main>
  <script>
    "use strict";
    const telegram = window.Telegram && window.Telegram.WebApp;
    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    const focusOptions = [
      ["boundaries", "Границы и спокойное общение"],
      ["coparenting", "Договорённости с бывшим о детях"],
      ["rebuilding", "Опора после расставания"],
      ["dating", "Новые отношения — когда буду готова"],
    ];
    const stations = [
      {
        id: "tuman",
        chapter: "Туман",
        title: "Что поможет немного прояснить мысли?",
        description: "Не нужно разбираться во всём сразу. Начни с того, что сейчас посильно.",
        choices: [
          ["clarity", "Отделить известные факты от догадок"],
          ["pause", "Не пытаться решить всё сегодня"],
          ["person", "Обратиться к тому, кому доверяю"],
        ],
      },
      {
        id: "pojar",
        chapter: "Пожар",
        title: "Если впереди непростой разговор…",
        description: "Какой формат поможет сохранить ясность и безопасность?",
        choices: [
          ["logistics", "Только коротко обсудить конкретное дело"],
          ["pause", "Сначала взять паузу и ответить позже"],
          ["boundary", "Обозначить одну ясную границу"],
        ],
      },
      {
        id: "torg",
        chapter: "Торг",
        title: "Когда хочется всё исправить сразу…",
        description: "Что поможет не взваливать на себя больше, чем можно решить сейчас?",
        choices: [
          ["one_thing", "Выбрать один вопрос, который можно решить"],
          ["rest", "Разрешить себе не принимать решение немедленно"],
          ["accept", "Сосредоточиться на том, что зависит от меня"],
        ],
      },
      {
        id: "tishina",
        chapter: "Тишина",
        title: "Где может появиться немного опоры?",
        description: "Выбери то, что кажется посильным, а не идеальным.",
        choices: [
          ["friend", "Связаться с человеком, которому доверяю"],
          ["time", "Выделить немного времени только себе"],
          ["professional", "Поговорить с живым специалистом"],
        ],
      },
      {
        id: "svoya",
        chapter: "Своя",
        title: "Какой маленький шаг возьмёшь с собой?",
        description: "Его можно изменить или отменить в любой момент.",
        choices: [
          ["message", "Не отвечать сгоряча"],
          ["boundary", "Сказать, что мне подходит, а что нет"],
          ["small_step", "Сделать одну небольшую вещь для себя"],
        ],
      },
    ];
    const answers = {};
    let focus = "";
    let stationIndex = -1;
    const content = document.getElementById("content");
    const progress = document.getElementById("progress");
    const stepLabel = document.getElementById("step");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function renderOptions(options, onSelect) {
      const list = el("div", "options");
      options.forEach(([value, label]) => {
        const button = el("button", "choice", label);
        button.type = "button";
        button.addEventListener("click", () => onSelect(value));
        list.append(button);
      });
      return list;
    }

    function renderFocus() {
      stationIndex = -1;
      stepLabel.textContent = "Тема";
      progress.style.width = "0%";
      content.replaceChildren(
        el("p", "eyebrow", "Несколько минут для себя"),
        el("h1", "", "С чего начнём?"),
        el("p", "description", "Выбери тему, которая сейчас ближе. Здесь нет правильных ответов и обязательного маршрута."),
        renderOptions(focusOptions, (value) => {
          focus = value;
          renderStation(0);
        }),
      );
    }

    function renderStation(index) {
      if (index >= stations.length) {
        renderFinish();
        return;
      }
      stationIndex = index;
      const station = stations[index];
      stepLabel.textContent = `${index + 1} из ${stations.length}`;
      progress.style.width = `${Math.round((index + 1) / stations.length * 100)}%`;
      content.replaceChildren(
        el("p", "eyebrow", `Глава ${index + 1} · ${station.chapter}`),
        el("h1", "", station.title),
        el("p", "description", station.description),
        renderOptions(station.choices, (value) => {
          answers[station.id] = value;
          renderStation(index + 1);
        }),
      );
    }

    function renderFinish() {
      stepLabel.textContent = "Финиш";
      progress.style.width = "100%";
      const heading = el("h1", "", "На сегодня этого достаточно.");
      const description = el("p", "description", "Ты прошла пять глав маршрута в своём темпе. Можно закончить здесь — без сохранения и передачи ответов.");
      const consent = el("label", "consent");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = "share-consent";
      const consentText = el("span", "", "Я согласна передать выбранную тему и пять ответов боту и сохранить их для персонализации будущих подсказок. Имена и данные детей не передаются. Удалить ответы можно командой /forget.");
      consent.append(checkbox, consentText);

      const shareButton = el("button", "primary", "Сохранить и передать ответы в чат");
      shareButton.type = "button";
      shareButton.disabled = !telegram || typeof telegram.sendData !== "function";
      shareButton.addEventListener("click", () => {
        if (!checkbox.checked || !telegram || typeof telegram.sendData !== "function") return;
        telegram.sendData(JSON.stringify({
          type: "journey_result",
          version: 1,
          consent: true,
          focus,
          answers,
        }));
      });
      checkbox.addEventListener("change", () => {
        shareButton.disabled = !checkbox.checked || !telegram || typeof telegram.sendData !== "function";
      });

      const privateButton = el("button", "secondary", "Завершить без передачи ответов");
      privateButton.type = "button";
      privateButton.addEventListener("click", () => {
        if (telegram && typeof telegram.close === "function") telegram.close();
        else {
          content.replaceChildren(
            el("p", "eyebrow", "Готово"),
            el("h1", "", "Ответы остались только в этой игре."),
            el("p", "description", "Передачи боту не было. Можно закрыть это окно."),
          );
        }
      });

      const actions = el("div", "actions");
      actions.append(shareButton, privateButton);
      content.replaceChildren(
        el("p", "eyebrow", "Маршрут завершён"),
        heading,
        description,
        consent,
        actions,
      );
      if (shareButton.disabled) {
        content.append(el("p", "description", "Передача ответов доступна только при открытии игры кнопкой в Telegram. Ты всё равно можешь закончить без передачи."));
      }
    }

    renderFocus();
  </script>
</body>
</html>
